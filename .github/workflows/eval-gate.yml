# AQUA — evaluation regression gate
# Blueprint E2/PR-6 · Constitution L14: a capability gets an eval before a flag.
#
# This is the merge condition the baselines exist to be. It runs the full
# battery and then the gate, which compares extraction and retrieval quality
# against the committed baselines and fails on any regression.
#
# The noise band is ZERO, measured: three consecutive runs produce a
# byte-identical comparable body, and Node 20 reproduced Node 22's figures to
# four decimals. There is no model call and no clock in either suite, so a
# tolerance would only hide small regressions.
name: eval-gate

on:
  pull_request:
    paths: ['aqua/**']
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aqua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20          # the version the baselines were reproduced on
      - run: npm ci
      - name: Test battery
        run: npm test
      - name: Evaluation regression gate
        run: npm run eval:gate
